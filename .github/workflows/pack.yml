name: pack

on:
  push:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # CI version tracks the latest release tag: on the tagged commit itself it equals the
      # release version exactly; every commit after that increments the patch by one. This
      # keeps CI numbering continuous with whatever MAJOR.MINOR.PATCH was last released,
      # with no manual bumping required.
      - id: version
        run: |
          DESC=$(git describe --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$DESC" ]; then
            echo "::error::No vMAJOR.MINOR.PATCH release tag found in this branch's history; cannot compute a CI version." >&2
            exit 1
          fi
          COMMITS_SINCE=$(echo "$DESC" | sed -E 's/^.*-([0-9]+)-g[0-9a-f]+$/\1/')
          BASE=$(echo "$DESC" | sed -E 's/-[0-9]+-g[0-9a-f]+$//; s/^v//')
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          echo "version=${MAJOR}.${MINOR}.$((PATCH + COMMITS_SINCE))" >> "$GITHUB_OUTPUT"

  pack:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet pack Pysar.CI.slnf -c Release -o artifacts -p:PackageVersion=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v6
        with:
          name: nupkg
          path: artifacts/*.nupkg

  pack-maui:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Android build needs JDK 21; the runner's preinstalled JDK is not guaranteed to match.
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '21'
      # android/ios/maccatalyst are the only unconditional TargetFrameworks (see the csproj
      # comment); the windows one only activates when building on a Windows host, so it is not
      # produced here - this job only covers what macos-latest can actually build.
      - run: dotnet workload install maui
      - run: dotnet pack src/Pysar.Maui/Pysar.Maui.csproj -c Release -o artifacts -p:PackageVersion=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v6
        with:
          name: nupkg-maui
          path: artifacts/*.nupkg

  pack-wpf:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Wpf.csproj only takes the net10.0-windows/UseWPF branch on a Windows host (see the
      # csproj comment); on any other OS it packs a non-packable placeholder instead.
      - run: dotnet pack src/Pysar.Wpf/Pysar.Wpf.csproj -c Release -o artifacts -p:PackageVersion=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v6
        with:
          name: nupkg-wpf
          path: artifacts/*.nupkg

  publish:
    needs: [pack, pack-maui, pack-wpf]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: nupkg-maui
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: nupkg-wpf
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet nuget push "artifacts/*.nupkg" --source https://nuget.pkg.github.com/MriyaLab/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
