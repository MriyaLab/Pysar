name: PR

on:
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Pysar.CI.slnf
      - name: Build
        # TODO: add -warnaserror once the existing warnings are cleared.
        run: dotnet build Pysar.CI.slnf -c Release --no-restore
      # The WPF test project is a non-test placeholder off Windows and real tests on it (see its
      # csproj), so this one command covers both legs of the matrix.
      - name: Test
        run: dotnet test Pysar.CI.slnf -c Release --no-build
